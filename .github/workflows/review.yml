name: Review

run-name: >-
  Review PR #${{ github.event.issue.number || inputs.pr-number || 'unknown' }}
  (${{ github.event_name == 'workflow_dispatch' && (inputs.mode || 'human') || 'comment' }})

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true
        type: string
      mode:
        description: Review mode (human or agent)
        required: false
        type: choice
        default: human
        options:
          - human
          - agent
      model:
        description: Claude model override (defaults to vars.REV_ENGINE_MODEL or opus)
        required: false
        type: string
        default: ""
      effort:
        description: Reasoning effort override (low, medium, high, xhigh, max; defaults to vars.REV_ENGINE_EFFORT or high)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

env:
  REV_ENGINE_REPO: laude-institute/rev-engine
  REV_ENGINE_SHA: 1d03097bcff5c37d94f000cae6a735e4120657a5
  CLAUDE_CODE_VERSION: 2.1.330

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review'))
    concurrency:
      group: rev-engine-${{ github.event.issue.number || inputs.pr-number || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Everything from the event is passed through env and never interpolated into scripts.
      - name: Check who asked
        id: ask
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.event.comment.user.login || github.actor }}
          COMMENT: ${{ github.event.comment.body }}
          COMMENT_ON_PR: ${{ github.event.issue.pull_request.url }}
          EVENT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          INPUT_NUMBER: ${{ inputs.pr-number }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_EFFORT: ${{ inputs.effort }}
          VAR_MODEL: ${{ vars.REV_ENGINE_MODEL }}
          VAR_EFFORT: ${{ vars.REV_ENGINE_EFFORT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::No review: $1"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }

          MODE="${INPUT_MODE:-human}"
          number="${INPUT_NUMBER:-$EVENT_NUMBER}"
          if [ "$EVENT_NAME" = issue_comment ]; then
            [ -n "$COMMENT_ON_PR" ] || skip "the comment is not on a pull request"
            first=$(printf '%s\n' "$COMMENT" | head -n 1 | tr -d '\r' | sed 's/[[:space:]]*$//')
            case "$first" in
              "/review"|"/review"[[:space:]]*) ;;
              *) skip "the comment is not /review" ;;
            esac
            number="$EVENT_NUMBER"
            word=$(printf '%s' "${first#"/review"}" | awk '{print tolower($1)}')
            case "$word" in agent|human) MODE="$word" ;; esac
          fi
          case "$MODE" in agent|human) ;; *) echo "::error::mode must be agent or human"; exit 1 ;; esac
          case "$number" in ''|*[!0-9]*) echo "::error::No pull request number. Set pr-number."; exit 1 ;; esac

          perm_err=$(mktemp)
          if perm_json=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" 2>"$perm_err"); then
            permission=$(printf '%s' "$perm_json" | jq -r '.permission // "none"')
            rm -f "$perm_err"
          else
            err_msg=$(cat "$perm_err")
            rm -f "$perm_err"
            if printf '%s' "$err_msg" | grep -q '(HTTP 404)'; then
              permission="none"
            else
              echo "::error::Failed to check collaborator permissions for $ACTOR: $err_msg"
              exit 1
            fi
          fi
          case "$permission" in admin|write) ;; *) skip "$ACTOR does not have write access to $REPO" ;; esac

          {
            echo "authorized=true"
            echo "number=$number"
          } >> "$GITHUB_OUTPUT"

          MODEL=$(printf '%s' "${INPUT_MODEL:-${VAR_MODEL:-opus}}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          [ -n "$MODEL" ] || MODEL="opus"
          EFFORT=$(printf '%s' "${INPUT_EFFORT:-${VAR_EFFORT:-high}}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          [ -n "$EFFORT" ] || EFFORT="high"

          model_re='^((anthropic/)?claude-[a-z0-9.-]+(\[1m\])?|(opus|sonnet|haiku|fable)(\[1m\])?|default|best|opusplan)$'
          if [[ ! "$MODEL" =~ $model_re ]]; then
            echo "::error::Invalid Claude model '$MODEL'"
            exit 1
          fi
          case "$EFFORT" in
            low|medium|high|xhigh|max) ;;
            *) echo "::error::Invalid effort '$EFFORT' (must be low, medium, high, xhigh, or max)"; exit 1 ;;
          esac

          mkdir -p "$RUNNER_TEMP/rev-engine-prime/pr" "$RUNNER_TEMP/rev-engine-prime/out"
          gh api "repos/$REPO/pulls/$number" > "$RUNNER_TEMP/rev-engine-prime/pull.json"
          jq '{title, body}' "$RUNNER_TEMP/rev-engine-prime/pull.json" > "$RUNNER_TEMP/rev-engine-prime/pr/pr.json"
          if [ "$(jq -r '.head.repo.full_name // ""' "$RUNNER_TEMP/rev-engine-prime/pull.json")" != "$REPO" ]; then
            gh api "repos/$REPO/pulls/$number/reviews" \
              -f event=COMMENT \
              -f body="RevEngine skipped PR #$number: pull requests from forks are not reviewed. ([workflow run]($RUN_URL))" \
              > /dev/null || echo "::warning::Could not post fork-skip notice to PR #$number"
            skip "pull request $number comes from a fork"
          fi
          {
            echo "run=true"
            echo "mode=$MODE"
            echo "base=$(jq -r .base.sha "$RUNNER_TEMP/rev-engine-prime/pull.json")"
            echo "head=$(jq -r .head.sha "$RUNNER_TEMP/rev-engine-prime/pull.json")"
            echo "model=$MODEL"
            echo "effort=$EFFORT"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the pull request
        if: steps.ask.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.ask.outputs.head }}
          fetch-depth: 0
          path: rev-engine-prime-checkout
          persist-credentials: false
          token: ${{ github.token }}

      - name: Write the diff
        if: steps.ask.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.ask.outputs.base }}
          HEAD: ${{ steps.ask.outputs.head }}
        run: |
          set -euo pipefail
          repo="$GITHUB_WORKSPACE/rev-engine-prime-checkout"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -C "$repo" -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --quiet --no-tags origin "$BASE"
          git -C "$repo" diff "$BASE...$HEAD" > "$RUNNER_TEMP/rev-engine-prime/pr/diff.patch"

      - name: Fetch pinned RevEngine source
        if: steps.ask.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/rev-engine-src"
          rm -rf "$src"
          git init -q "$src"
          git -C "$src" fetch -q --depth=1 "https://github.com/${REV_ENGINE_REPO}.git" "$REV_ENGINE_SHA"
          git -C "$src" checkout -q --detach FETCH_HEAD
          [ "$(git -C "$src" rev-parse HEAD)" = "$REV_ENGINE_SHA" ]

      - name: Set up Docker Buildx
        if: steps.ask.outputs.run == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build RevEngine image with Claude Code
        if: steps.ask.outputs.run == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/rev-engine-src
          load: true
          tags: rev-engine-prime:action
          build-args: CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
          cache-from: type=gha,scope=rev-engine-${{ env.REV_ENGINE_SHA }}-claude-${{ env.CLAUDE_CODE_VERSION }}
          cache-to: type=gha,mode=max,scope=rev-engine-${{ env.REV_ENGINE_SHA }}-claude-${{ env.CLAUDE_CODE_VERSION }}

      # Holds GITHUB_TOKEN and no Claude token.
      - name: Collect earlier decisions
        if: steps.ask.outputs.run == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
          RB_NWO: ${{ github.repository }}
          RB_PR_NUMBER: ${{ steps.ask.outputs.number }}
        run: |
          docker run --rm --entrypoint node \
            -v "$RUNNER_TEMP/rev-engine-src/action:/agent/action:ro" \
            -v "$RUNNER_TEMP/rev-engine-prime/pr:/work/pr" \
            -e GITHUB_TOKEN -e GITHUB_API_URL -e GITHUB_GRAPHQL_URL -e RB_NWO -e RB_PR_NUMBER -e PRIOR_PATH=/work/pr/prior.json \
            rev-engine-prime:action /agent/action/collect.ts \
            || echo "::warning::Earlier decisions not collected: the collector exited with an error"

      # Holds CLAUDE_CODE_OAUTH_TOKEN and no GITHUB_TOKEN; repo checkout is mounted read-only.
      - name: Review
        if: steps.ask.outputs.run == 'true'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RB_CONFIG_ENGINE: claude-code
          RB_CONFIG_FALLBACK: off
          RB_CONFIG_SWARM: off
          RB_CONFIG_MODEL: ${{ steps.ask.outputs.model }}
          RB_CONFIG_EFFORT: ${{ steps.ask.outputs.effort }}
          RB_CONFIG_MODE: ${{ steps.ask.outputs.mode }}
          RB_CONFIG_FIT: ${{ steps.ask.outputs.mode == 'human' && steps.ask.outputs.model || '' }}
          RB_CONFIG_TIME_BUDGET: "780"
          RB_NWO: ${{ github.repository }}
          RB_PR_NUMBER: ${{ steps.ask.outputs.number }}
          RB_BASE: ${{ steps.ask.outputs.base }}
          RB_HEAD: ${{ steps.ask.outputs.head }}
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::Missing CLAUDE_CODE_OAUTH_TOKEN secret. Run 'claude setup-token' locally and save it with: gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo $RB_NWO"
            exit 1
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE/rev-engine-prime-checkout:/work/repo:ro" \
            -v "$RUNNER_TEMP/rev-engine-prime/pr:/work/pr:ro" \
            -v "$RUNNER_TEMP/rev-engine-prime/out:/work/out" \
            -e CLAUDE_CODE_OAUTH_TOKEN \
            -e RB_CONFIG_ENGINE -e RB_CONFIG_FALLBACK -e RB_CONFIG_SWARM \
            -e RB_CONFIG_MODEL -e RB_CONFIG_EFFORT -e RB_CONFIG_MODE -e RB_CONFIG_FIT -e RB_CONFIG_TIME_BUDGET \
            -e RB_NWO -e RB_PR_NUMBER -e RB_BASE -e RB_HEAD \
            -e RB_DETAILS_OUT=/work/out/details.json \
            -e RB_REPO=/work/repo -e RB_DIFF=/work/pr/diff.patch -e RB_PR_JSON=/work/pr/pr.json -e RB_PRIOR_JSON=/work/pr/prior.json \
            -e RB_OUT=/work/out/findings.json -e RB_ATTEMPT=1 \
            rev-engine-prime:action

      - name: Save the review
        if: steps.ask.outputs.run == 'true' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rev-engine-prime-pr-${{ steps.ask.outputs.number }}
          path: ${{ runner.temp }}/rev-engine-prime/out/*.json
          if-no-files-found: ignore

      # Holds GITHUB_TOKEN and no Claude token.
      - name: Post the review
        if: steps.ask.outputs.run == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
          RB_NWO: ${{ github.repository }}
          RB_PR_NUMBER: ${{ steps.ask.outputs.number }}
          RB_HEAD: ${{ steps.ask.outputs.head }}
          REVIEW_MODEL: ${{ format('Claude Code ({0})', steps.ask.outputs.model) }}
          REVIEW_MODE: ${{ steps.ask.outputs.mode }}
          MIN_SEVERITY: medium
          MAX_COMMENTS: "10"
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node \
            -v "$RUNNER_TEMP/rev-engine-src/action:/agent/action:ro" \
            -v "$RUNNER_TEMP/rev-engine-prime:/work:ro" \
            -e GITHUB_TOKEN -e GITHUB_API_URL -e GITHUB_GRAPHQL_URL -e RB_NWO -e RB_PR_NUMBER -e RB_HEAD \
            -e REVIEW_MODEL -e REVIEW_MODE -e MIN_SEVERITY -e MAX_COMMENTS \
            -e FINDINGS_PATH=/work/out/details.json -e FIT_PATH=/work/out/fit.json -e DIFF_PATH=/work/pr/diff.patch \
            rev-engine-prime:action /agent/action/post.ts

      # Holds GITHUB_TOKEN and no Claude token.
      - name: Notify failure on pull request
        if: failure() && steps.ask.outputs.authorized == 'true' && steps.ask.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.ask.outputs.number }}
          HEAD_SHA: ${{ steps.ask.outputs.head }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            -f event=COMMENT \
            -f body="RevEngine review failed${HEAD_SHA:+ for commit \`${HEAD_SHA:0:7}\`}. Check the [workflow run logs]($RUN_URL) for details." \
            > /dev/null || echo "::warning::Could not post failure notice to PR #$PR_NUMBER"
